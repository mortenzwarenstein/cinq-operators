
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-example
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: postgres-example
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: workshop
  POSTGRES_DB: app
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres-example
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres